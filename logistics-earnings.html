<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Earnings & Hours | Samruddhi Setu</title><link rel="icon" href="assets/logo.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css?v=6"><link rel="stylesheet" href="css/shell.css?v=6"><style>.lg-page{padding-top:24px}.lg-page h1{font:700 1.8rem 'Playfair Display',serif;color:var(--primary-deep);margin:0 0 5px}.lg-page .sub{color:var(--text-muted);font-size:.88rem}.lg-hero{margin-top:20px;padding:25px 28px;border:1px solid #E3EBE4;border-radius:18px;background:#fff;box-shadow:0 8px 28px #164d2210;display:flex;justify-content:space-between;gap:18px;align-items:center}.lg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.lg-card{padding:22px;border:1px solid #E3EBE4;border-radius:16px;background:#fff;box-shadow:0 8px 24px #164d2209}.lg-card h3{margin:4px 0 10px;color:var(--primary-deep)}.lg-label{color:#74837a;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.lg-value{font-size:1.35rem;font-weight:800;color:#15251a}.lg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid #edf2ee}.lg-row:last-child{border-bottom:0}.lg-ok{color:#15803D;font-weight:800}.lg-dark{margin-top:18px;background:#0D172A;color:#fff;border-radius:16px;padding:24px}.lg-dark h3{color:#fff}@media(max-width:800px){.lg-grid{grid-template-columns:1fr}.lg-hero{align-items:flex-start;flex-direction:column}}</style></head><body><div id="appShellRoot"></div><main class="app-main"><div class="page-wrap lg-page"><div><h1>Earnings & Hours</h1><p class="sub">Transparent payouts and duty performance synced to completed dispatches.</p></div><div class="lg-grid"><div class="lg-card"><div class="lg-label">Today's earnings</div><div class="lg-value" id="rtTodayEarnings">₹0</div><span>Week total: <span id="rtWeekEarnings">—</span></span></div><div class="lg-card"><div class="lg-label">Working hours</div><div class="lg-value">0 hrs</div><span>Duty completed for today</span></div><div class="lg-card"><div class="lg-label">Payout status</div><div class="lg-value lg-ok">Cleared</div><span>Firebase-linked statement</span></div></div><div class="lg-card" style="margin-top:18px"><div class="lg-label">Recent payout activity</div><div class="lg-row"><span>Completed trips</span><b id="rtCompletedTrips">0</b></div><div class="lg-row"><span>Next settlement</span><b>Scheduled automatically</b></div></div><script>document.addEventListener("DOMContentLoaded",async()=>{try{const u=SamruddhiAuth.getStoredUser()||{};const s=await AgriSetuDB.db.collection("orders").get();const n=s.docs.map(d=>d.data()).filter(o=>o.logisticsId===u.uid&&o.status==="delivered");document.getElementById("tripCount").textContent=n.length;document.getElementById("todayEarnings").textContent="₹"+n.reduce((a,o)=>a+(o.logisticsPayout||0),0).toLocaleString("en-IN")}catch(e){}});</script></div></main><script src="js/i18n.js?v=6"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="js/firebase-config.js?v=8"></script><script src="js/app.js?v=8"></script><script src="js/logistics-realtime.js?v=1"></script><script src="js/shell.js?v=7"></script><script>renderAppShell({role:"logistics",active:"earnings",searchPlaceholder:"Search logistics workspace..."}); window.addEventListener("DOMContentLoaded",()=>{const u=SamruddhiAuth.getStoredUser()||{}; document.querySelectorAll("[data-user]").forEach(e=>e.textContent=u.name||"Logistics partner"); window.AgriSetuDB?.db.collection("users").doc(u.uid||"guest").get().catch(()=>{});});</script><script src="js/gemini-service.js?v=10"></script><script src="js/global-chatbot.js?v=1"></script></body></html>
