<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders & Deliveries | Samruddhi Setu</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/shell.css?v=6">
</head>
<body>

  <div id="appShellRoot"></div>

  <main class="app-main">
    <div class="page-wrap">
      <div class="page-head">
        <div><h1>Orders & Deliveries</h1><p>Track active, pending & completed purchases with live delivery status.</p></div>
      </div>

      <div class="shell-grid cols-4">
        <div class="stat-tile"><div class="orders-kpi-val" id="kpiTotalSpent">₹0</div><div class="stat-label">Total Spent</div></div>
        <div class="stat-tile"><div class="orders-kpi-val" id="kpiTotalSaved">₹0</div><div class="stat-label">Total Saved</div></div>
        <div class="stat-tile"><div class="orders-kpi-val" id="kpiActiveDeliveries">0</div><div class="stat-label">Active Deliveries</div></div>
        <div class="stat-tile"><div class="orders-kpi-val" id="kpiBulkContracts">0</div><div class="stat-label">Bulk Contracts</div></div>
      </div>
      <span style="display:none;" id="statTotalOrders"></span><span style="display:none;" id="statInTransit"></span>
      <span style="display:none;" id="dashConsumerAvatar"></span>

      <div class="tab-pill-group" style="margin-top:28px;">
        <div class="orders-tabs" style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="tab-pill category-chip active" onclick="setOrderFilter('all', this)">All</button>
          <button class="tab-pill category-chip" onclick="setOrderFilter('retail', this)">Retail</button>
          <button class="tab-pill category-chip" onclick="setOrderFilter('bulk', this)">Bulk / Contracts</button>
          <button class="tab-pill category-chip" onclick="setOrderFilter('out_for_delivery', this)">In Transit</button>
          <button class="tab-pill category-chip" onclick="setOrderFilter('delivered', this)">Delivered</button>
        </div>
      </div>

      <div class="app-topbar-search" style="max-width:420px; margin-bottom:20px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="orderSearchInput" placeholder="Search by Order ID, item, or producer..." oninput="renderOrdersPage()" />
      </div>

      <div id="myOrdersList"></div>
    </div>
  </main>

  <div class="modal-overlay" id="invoiceReceiptModal">
    <div class="modal-box">
      <button class="modal-close-btn" id="closeInvoiceModalBtn"><i class="fa-solid fa-xmark"></i></button>
      <div id="invoiceContentContainer"></div>
    </div>
  </div>

  <div class="modal-overlay" id="editOrderModal">
    <div class="modal-box">
      <button class="modal-close-btn" id="closeEditOrderModalBtn" onclick="closeEditOrderModal()"><i class="fa-solid fa-xmark"></i></button>
      <div id="editOrderContentContainer"></div>
    </div>
  </div>

  <script src="js/i18n.js?v=6"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=8"></script>
  <script src="js/gemini-service.js?v=6"></script>
  <script src="js/app.js?v=8"></script>
  <script src="js/shell.js?v=7"></script>
  <script>
    renderAppShell({ role: "consumer", active: "orders", searchPlaceholder: "Search orders..." });

    let allMyOrders = [];
    let currentOrderFilter = "all";
    let currentOrderSearch = "";
    window._orderMap = {};

    window.viewInvoiceForOrder = function (id) {
      const ord = window._orderMap[id];
      if (ord) showInvoiceModal(ord);
    };

    document.addEventListener("DOMContentLoaded", () => {
      const user = SamruddhiAuth.getStoredUser();
      const buyerId = user?.uid || null;

      window.AgriSetuDB.db.collection("orders").onSnapshot((snap) => {
        const orders = snap.docs.map(d => d.data());
        allMyOrders = orders.filter(o => o.buyerId === buyerId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        renderOrderStats();
        renderOrdersPage();
      });
    });

    window.openEditOrderModal = function (id) {
      const ord = window._orderMap[id];
      const modal = document.getElementById("editOrderModal");
      const container = document.getElementById("editOrderContentContainer");
      if (!ord || !modal || !container) return;
      const isLocked = ord.status === "delivered" || ord.status === "cancelled";
      container.innerHTML = `
        <div style="border-bottom:2px solid #E2E8F0; padding-bottom:14px; margin-bottom:16px;">
          <h2 style="color:var(--primary-deep); font-family:'Playfair Display',serif;">Edit Order</h2>
          <p style="font-size:0.82rem; color:var(--text-muted);">Order ID: <strong>${ord.id}</strong> • Status: <strong>${window.SamruddhiOrders.statusLabel(ord.status)}</strong></p>
        </div>
        ${isLocked ? `<div style="background:#FEF2F2; border:1.5px solid #FCA5A5; color:#B91C1C; padding:12px 14px; border-radius:10px; font-size:0.85rem; margin-bottom:16px;">
            <i class="fa-solid fa-triangle-exclamation"></i> This order is already <strong>${ord.status}</strong> and can no longer be edited.
          </div>` : ``}
        <div class="form-group" style="margin-bottom:14px;">
          <label>Delivery Address</label>
          <input type="text" id="editOrderAddress" class="form-control" value="${(ord.deliveryAddress || ord.buyerLocation || "").replace(/"/g, '&quot;')}" ${isLocked ? "disabled" : ""} />
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label>Contact Number</label>
          <input type="tel" id="editOrderPhone" class="form-control" value="${(ord.buyerPhone || "").replace(/"/g, '&quot;')}" ${isLocked ? "disabled" : ""} />
        </div>
        <div class="form-group" style="margin-bottom:18px;">
          <label>Order Items & Quantity</label>
          ${(ord.items || []).map((i, idx) => `
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
              <span style="flex:1; font-size:0.88rem;">${i.title} (${i.unit || 'unit'})</span>
              <input type="number" min="1" class="form-control edit-order-qty" data-idx="${idx}" value="${i.quantity}" style="width:100px;" ${isLocked ? "disabled" : ""} />
            </div>`).join("")}
        </div>
        <div style="display:flex; gap:12px;">
          ${!isLocked ? `
            <button class="btn-luxury-gold" style="flex:1; padding:12px;" onclick="saveOrderEdits('${ord.id}')"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
            <button class="btn-luxury-outline" style="padding:12px 18px; color:#EF4444; border-color:#F87171;" onclick="cancelOrder('${ord.id}')"><i class="fa-solid fa-ban"></i> Cancel Order</button>` :
            `<button class="btn-luxury-outline" style="flex:1; padding:12px;" onclick="closeEditOrderModal()">Close</button>`}
        </div>`;
      modal.classList.add("open");
    };

    window.closeEditOrderModal = function () { document.getElementById("editOrderModal")?.classList.remove("open"); };

    window.saveOrderEdits = async function (id) {
      const ord = window._orderMap[id];
      if (!ord) return;
      const address = document.getElementById("editOrderAddress")?.value.trim();
      const phone = document.getElementById("editOrderPhone")?.value.trim();
      const qtyInputs = document.querySelectorAll(".edit-order-qty");
      const updatedItems = (ord.items || []).map((item, idx) => {
        const input = [...qtyInputs].find(el => Number(el.getAttribute("data-idx")) === idx);
        const qty = input ? parseInt(input.value, 10) : item.quantity;
        return { ...item, quantity: qty > 0 ? qty : item.quantity };
      });
      const updatedTotal = updatedItems.reduce((sum, i) => sum + (i.price * i.quantity), 0);
      const updates = { deliveryAddress: address, buyerPhone: phone, items: updatedItems, totalAmount: updatedTotal };
      try {
        await window.AgriSetuDB.db.collection("orders").doc(id).update(updates);
        Object.assign(ord, updates);
        showToast("Order updated successfully!");
        closeEditOrderModal();
        renderOrderStats(); renderOrdersPage();
      } catch (err) { console.warn(err); showToast("Could not update order right now."); }
    };

    window.cancelOrder = async function (id) {
      if (!confirm("Cancel this order? This cannot be undone.")) return;
      try {
        await window.AgriSetuDB.db.collection("orders").doc(id).update({ status: "cancelled" });
        const ord = window._orderMap[id];
        if (ord) ord.status = "cancelled";
        showToast("Order cancelled.");
        closeEditOrderModal(); renderOrderStats(); renderOrdersPage();
      } catch (err) { console.warn(err); showToast("Could not cancel order right now."); }
    };

    function renderOrderStats() {
      const totalSpent = allMyOrders.reduce((s, o) => s + (o.totalAmount || 0), 0);
      const totalSaved = allMyOrders.reduce((s, o) => s + (o.savings || 0), 0);
      const inTransit = allMyOrders.filter(o => o.status === "out_for_delivery").length;
      const bulkContracts = allMyOrders.filter(o => o.deliveryType === "large_truck").length;
      document.getElementById("kpiTotalSpent").innerText = "₹" + totalSpent.toLocaleString();
      document.getElementById("kpiTotalSaved").innerText = "₹" + totalSaved.toLocaleString();
      document.getElementById("kpiActiveDeliveries").innerText = inTransit;
      document.getElementById("kpiBulkContracts").innerText = bulkContracts;
    }

    function setOrderFilter(filter, btn) {
      currentOrderFilter = filter;
      document.querySelectorAll(".category-chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      renderOrdersPage();
    }

    function renderOrdersPage() {
      currentOrderSearch = (document.getElementById("orderSearchInput").value || "").trim().toLowerCase();
      let filtered = [...allMyOrders];
      if (currentOrderFilter === "retail") filtered = filtered.filter(o => o.deliveryType !== "large_truck");
      else if (currentOrderFilter === "bulk") filtered = filtered.filter(o => o.deliveryType === "large_truck");
      else if (currentOrderFilter === "out_for_delivery") filtered = filtered.filter(o => o.status === "out_for_delivery");
      else if (currentOrderFilter === "delivered") filtered = filtered.filter(o => o.status === "delivered");
      if (currentOrderSearch) {
        filtered = filtered.filter(o => o.id.toLowerCase().includes(currentOrderSearch) || (o.farmerName || "").toLowerCase().includes(currentOrderSearch) || o.items.some(i => i.title.toLowerCase().includes(currentOrderSearch)));
      }
      const container = document.getElementById("myOrdersList");
      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-orders-state"><i class="fa-solid fa-box-open"></i><h3 style="color:var(--primary-deep); margin-bottom:6px;">No orders found</h3><p>Nothing matches this filter yet. Head to the marketplace to place your first direct farm order.</p><a href="consumer-marketplace.html" class="btn-luxury-gold" style="display:inline-block; margin-top:16px; padding:10px 22px;"><i class="fa-solid fa-basket-shopping"></i> Browse Marketplace</a></div>`;
        return;
      }
      container.innerHTML = filtered.map(ord => {
        window._orderMap[ord.id] = ord;
        const isBulk = ord.deliveryType === "large_truck";
        const isOnline = ord.paymentMethod === "ONLINE";
        const isPaid = isOnline || ord.paymentStatus === "paid_test_mode";
        const paymentBadge = ord.paymentMethod ? `
              <span class="ph-method-pill ${isOnline ? 'online' : 'cod'}" style="margin-left:8px;"><i class="fa-solid ${isOnline ? 'fa-credit-card' : 'fa-hand-holding-dollar'}"></i> ${isOnline ? 'Razorpay (Test)' : 'COD'}</span>
              <span class="ph-status-pill ${isPaid ? 'paid' : 'pending'}" style="margin-left:6px;"><i class="fa-solid ${isPaid ? 'fa-circle-check' : 'fa-clock'}"></i> ${isPaid ? 'Paid' : 'Due on delivery'}</span>` : "";
        return `
        <div class="order-card" id="order-card-${ord.id}">
          <div class="order-card-top">
            <div>
              <span class="order-type-tag ${isBulk ? 'bulk' : 'retail'}">${isBulk ? 'BULK / CONTRACT' : 'RETAIL'}</span>
              <strong style="font-size:1.02rem; color:var(--primary-deep); margin-left:8px;">${ord.id}</strong>
              <span style="font-size:0.8rem; color:var(--text-muted); margin-left:8px;">Direct from: ${ord.farmerName}</span>
            </div>
            <div><span class="role-badge-pill" style="background:${window.SamruddhiOrders.statusColor(ord.status)}1A; color:${window.SamruddhiOrders.statusColor(ord.status)}; border-color:${window.SamruddhiOrders.statusColor(ord.status)}55;">${window.SamruddhiOrders.statusLabel(ord.status)}</span>${paymentBadge}</div>
          </div>
          <div class="order-items-line">${ord.items.map(i => `• ${i.title} (${i.quantity} ${i.unit || 'unit'})`).join(" &nbsp; ")}</div>
          ${window.SamruddhiOrders.renderTimeline(ord)}
          <div class="order-card-bottom">
            <div>
              <span style="font-size:1.1rem; font-weight:800; color:var(--primary-deep);">₹${(ord.totalAmount || 0).toLocaleString()}</span>
              <span style="font-size:0.78rem; color:#15803D; margin-left:8px; font-weight:700;">(Saved ₹${(ord.savings || 0).toLocaleString()})</span>
              <span style="font-size:0.75rem; color:var(--text-muted); margin-left:10px;">${new Date(ord.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a href="track-delivery.html?order=${ord.id}" class="btn-luxury-outline" style="padding:6px 14px; font-size:0.8rem;"><i class="fa-solid fa-map-location-dot"></i> Live GPS</a>
              <button class="btn-luxury-outline" style="padding:6px 14px; font-size:0.8rem;" onclick="openEditOrderModal('${ord.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
              <button class="btn-luxury-gold" style="padding:6px 14px; font-size:0.8rem;" onclick="viewInvoiceForOrder('${ord.id}')"><i class="fa-solid fa-file-invoice"></i> Receipt</button>
            </div>
          </div>
        </div>`;
      }).join("");
    }
  </script>

  <!-- Cart drawer (shared component) -->
  <div class="cart-drawer" id="cartFlyoutDrawer">
    <div class="cart-drawer-head" style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px;">
      <h3>Your Basket</h3>
      <button id="closeCartBtn" style="background:transparent; color:#FFF; font-size:1.3rem;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="cart-items-list" id="cartItemsContainer"></div>
    <div style="padding:16px 20px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Total</span><span style="font-size:1.3rem; font-weight:800; color:var(--primary-deep);" id="cartTotalPrice">₹0</span></div>
      <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:0.85rem;"><span>You saved</span><span id="cartTotalSavings" style="font-weight:700;">₹0</span></div>
      <button class="btn-luxury-gold" id="proceedToCheckoutBtn" style="width:100%; padding:12px; font-size:1rem;">Proceed to Checkout</button>
    </div>
  </div>
<script src="js/global-chatbot.js?v=1"></script></body>
</html>
